name: 🧪 Test Automation

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test filter (e.g., "*Api*", "*ui*")'
        required: false
        default: '*'
      browser:
        description: 'Browser for UI tests'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  CI: true

jobs:
  # ============================================
  # Линтинг и проверка кода
  # ============================================
  lint:
    name: 🔍 Lint & Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'gradle'

      - name: 🔧 Grant execute permission
        run: chmod +x gradlew

      - name: 🔍 Run ktlint
        run: ./gradlew ktlintCheck

  # ============================================
  # API тесты
  # ============================================
  api-tests:
    name: 🔌 API Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'gradle'

      - name: 🔧 Grant execute permission
        run: chmod +x gradlew

      - name: 🧪 Run API Tests
        run: ./gradlew apiTest

      - name: 📊 Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: build/allure-results
          retention-days: 7

      - name: 📋 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-api
          path: build/test-results
          retention-days: 7

  # ============================================
  # UI тесты
  # ============================================
  ui-tests:
    name: 🖥️ UI Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
        # Раскомментируйте для тестирования на нескольких браузерах:
        # browser: [chromium, firefox, webkit]
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'gradle'

      - name: 🔧 Grant execute permission
        run: chmod +x gradlew

      - name: 🎭 Install Playwright Browsers
        run: |
          npx playwright install ${{ matrix.browser }} --with-deps

      - name: 🧪 Run UI Tests
        run: ./gradlew uiTest
        env:
          BROWSER: ${{ matrix.browser }}

      - name: 📊 Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ui-${{ matrix.browser }}
          path: build/allure-results
          retention-days: 7

      - name: 📋 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-ui-${{ matrix.browser }}
          path: build/test-results
          retention-days: 7

  # ============================================
  # Полный прогон тестов (ручной запуск)
  # ============================================
  full-test-suite:
    name: 🚀 Full Test Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'gradle'

      - name: 🔧 Grant execute permission
        run: chmod +x gradlew

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: 🧪 Run Tests
        run: |
          if [ "${{ github.event.inputs.test_filter }}" = "*" ]; then
            ./gradlew test
          else
            ./gradlew test --tests "${{ github.event.inputs.test_filter }}"
          fi
        env:
          BROWSER: ${{ github.event.inputs.browser }}

      - name: 📊 Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-full
          path: build/allure-results
          retention-days: 14

  # ============================================
  # Генерация Allure отчёта
  # ============================================
  allure-report:
    name: 📈 Allure Report
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()
    permissions:
      contents: write
      pages: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download API Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/api
        continue-on-error: true

      - name: 📥 Download UI Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-ui-*
          path: allure-results/ui
          merge-multiple: true
        continue-on-error: true

      - name: 📁 Merge Results
        run: |
          mkdir -p allure-results-merged
          find allure-results -name "*.json" -exec cp {} allure-results-merged/ \;
          find allure-results -name "*.txt" -exec cp {} allure-results-merged/ \;
          find allure-results -name "*.png" -exec cp {} allure-results-merged/ \; 2>/dev/null || true
          find allure-results -name "*.mp4" -exec cp {} allure-results-merged/ \; 2>/dev/null || true
          ls -la allure-results-merged/ | head -20

      - name: 📊 Install Allure CLI
        run: |
          npm install -g allure-commandline
          allure --version

      - name: 📥 Get Allure History
        uses: actions/checkout@v4
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-history
          fetch-depth: 1

      - name: 📁 Prepare History
        run: |
          mkdir -p allure-results-merged/history
          if [ -d "gh-pages-history/history" ]; then
            cp -r gh-pages-history/history/* allure-results-merged/history/ || true
          fi

      - name: 📊 Generate Allure Report
        if: always()
        run: |
          allure generate allure-results-merged -o allure-report --clean
          ls -la allure-report/

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          force_orphan: true

      - name: 💬 Add Report Link to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: owner,
              repo: repo,
              body: `## 📊 Test Results\n\n` +
                `🔗 [View Allure Report](https://${owner}.github.io/${repo}/)\n\n` +
                `📋 [Download Artifacts](https://github.com/${owner}/${repo}/actions/runs/${runId})`
            });

  # ============================================
  # Docker Build (опционально)
  # ============================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: qa-kotlin-framework:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Раскомментируйте для публикации в Docker Hub или GitHub Container Registry:
      # - name: 🔐 Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      #
      # - name: 📤 Push to Docker Hub
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     push: true
      #     tags: |
      #       ${{ secrets.DOCKERHUB_USERNAME }}/qa-kotlin-framework:latest
      #       ${{ secrets.DOCKERHUB_USERNAME }}/qa-kotlin-framework:${{ github.sha }}

